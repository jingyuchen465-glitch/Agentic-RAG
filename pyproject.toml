[project]
name = "agentic-rag"
version = "0.1.0"
description = "FastAPI Agentic RAG service with LangGraph orchestration and vector tool routing."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.0",
  "pymysql>=1.1.1",
  "redis>=5.0.0",
  "pymilvus>=2.5.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "llama-index-core>=0.12.0",
  "llama-index-readers-file>=0.4.0",
  "rank-bm25>=0.2.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
